<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Producto — Gran Prix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar scrolled" id="navbar">
    <div class="container">
      <div class="navbar-inner">
        <a href="index.html" class="navbar-logo">
          <img src="img/logo.svg" alt="Grand Prix Indumentaria Masculina" />
        </a>
        <ul class="navbar-links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="productos.html" class="active">Productos</a></li>
          <li><a href="novedades.html">Novedades</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
        <div class="navbar-right">
          <button class="cart-btn" onclick="Cart.open()" aria-label="Carrito">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
            </svg>
            <span id="cart-badge">0</span>
          </button>
          <button class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Menú">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
      <div class="mobile-menu" id="mobile-menu">
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="novedades.html">Novedades</a>
        <a href="contacto.html">Contacto</a>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO (se renderiza con JS) -->
  <div id="page-content"></div>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script>
    function toggleMenu() {
      document.getElementById("hamburger").classList.toggle("open");
      document.getElementById("mobile-menu").classList.toggle("open");
    }

    const id = new URLSearchParams(window.location.search).get("id");
    const p = getProductById(id);
    const content = document.getElementById("page-content");

    if (!p) {
      content.innerHTML = `
        <div style="min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4rem 1rem">
          <p style="font-family:'Bebas Neue',sans-serif;font-size:5rem;color:var(--border)">404</p>
          <p style="color:var(--muted);font-size:.875rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:2rem">Producto no encontrado</p>
          <a href="productos.html" class="btn-gold">Ver todos los productos</a>
        </div>`;
    } else {
      document.title = p.nombre + " — Gran Prix";

      let selectedTalle = p.talles[0];

      const badge = p.badge ? `<span class="product-badge badge-${p.badge}" style="position:static;display:inline-block;margin-bottom:1rem">${p.badge}</span>` : "";
      const oldPrice = p.precioAnterior
        ? `<span class="detail-price-old">${formatPrice(p.precioAnterior)}</span>
           <span class="discount-tag">${Math.round((1 - p.precio / p.precioAnterior) * 100)}% OFF</span>`
        : "";

      const tallesHTML = p.talles.map(t =>
        `<button class="talle-btn${t === selectedTalle ? " selected" : ""}" data-talle="${t}" onclick="selectTalle('${t}')">${t}</button>`
      ).join("");

      const coloresHTML = p.colores.map(c => `<span class="color-tag">${c}</span>`).join("");

      const related = getRelated(p, 4);
      const relatedHTML = related.length ? `
        <div style="margin-top:5rem;padding-top:3rem;border-top:1px solid var(--border)">
          <h2 class="section-title font-display" style="margin-bottom:2rem">TAMBIÉN TE PUEDE GUSTAR</h2>
          <div class="product-grid">
            ${related.map(r => {
              const rb = r.badge ? `<span class="product-badge badge-${r.badge}">${r.badge}</span>` : "";
              const ro = r.precioAnterior ? `<span class="product-price-old">${formatPrice(r.precioAnterior)}</span>` : "";
              const rimgHTML = r.imagen
                ? `<img src="${r.imagen}" alt="${r.nombre}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;">`
                : `<div class="placeholder-img"><svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="0.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 6v14h12V6M3 6l3-3 3 3M18 6l3-3-3-3"/></svg><span>${r.nombre}</span></div>`;
              return `
                <a href="producto.html?id=${r.id}" class="product-card">
                  <div class="product-card-img">
                    ${rimgHTML}
                    ${rb}
                    <button class="add-btn" onclick="event.preventDefault();Cart.add(getProductById('${r.id}'),'${r.talles[0]}')" aria-label="Agregar">
                      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                    </button>
                  </div>
                  <div class="product-card-body">
                    <p class="product-cat">${r.categoria}</p>
                    <p class="product-name">${r.nombre}</p>
                    <div class="product-prices">
                      <span class="product-price">${formatPrice(r.precio)}</span>${ro}
                    </div>
                  </div>
                </a>`;
            }).join("")}
          </div>
        </div>` : "";

      content.innerHTML = `
        <div style="padding-top:5rem">
          <div class="container">

            <!-- Breadcrumb -->
            <nav class="breadcrumb">
              <a href="index.html">Inicio</a>
              <span>/</span>
              <a href="productos.html">Productos</a>
              <span>/</span>
              <span style="color:var(--gray)">${p.nombre}</span>
            </nav>

            <!-- Detalle -->
            <div class="product-detail">
              <div class="detail-grid">

                <!-- Galería -->
                <div>
                  <div class="gallery-main" id="gallery-main">
                    ${p.imagen
                      ? `<img src="${p.imagen}" alt="${p.nombre}" id="gallery-main-img" style="width:100%;height:100%;object-fit:contain;background:#1a1a1a;display:block;">`
                      : `<div class="placeholder-img" style="height:100%"><svg width="64" height="64" fill="none" stroke="currentColor" stroke-width="0.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 6v14h12V6M3 6l3-3 3 3M18 6l3-3-3-3"/></svg><span>${p.nombre}</span></div>`
                    }
                    ${p.badge ? `<span class="product-badge badge-${p.badge}" style="position:absolute;top:1rem;left:1rem">${p.badge}</span>` : ""}
                  </div>
                  <div class="gallery-thumbs">
                    ${(() => {
                      const allImgs = [p.imagen, ...(p.galeria || [])].filter(Boolean);
                      if (allImgs.length === 0) {
                        return [1,2,3,4].map(() => `<div class="gallery-thumb"><div class="placeholder-img" style="height:100%"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="0.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 6v14h12V6M3 6l3-3 3 3M18 6l3-3-3-3"/></svg></div></div>`).join("");
                      }
                      return allImgs.map((src, i) => `<div class="gallery-thumb${i === 0 ? ' active-thumb' : ''}" onclick="switchGalleryImg('${src}', this)" style="cursor:pointer;${i === 0 ? 'border-color:var(--gold);' : ''}"><img src="${src}" alt="${p.nombre}" style="width:100%;height:100%;object-fit:contain;background:#1a1a1a;display:block;"></div>`).join("");
                    })()}
                  </div>
                </div>

                <!-- Info -->
                <div>
                  <p class="detail-cat">${p.categoria}</p>
                  <h1 class="detail-name">${p.nombre.toUpperCase()}</h1>

                  <div class="detail-prices">
                    <span class="detail-price">${formatPrice(p.precio)}</span>
                    ${oldPrice}
                  </div>

                  <!-- Talles -->
                  <div class="talle-section">
                    <div class="talle-label">
                      <span>Talle</span>
                      <span id="talle-selected">Seleccionado: ${selectedTalle}</span>
                    </div>
                    <div class="talle-btns" id="talle-btns">${tallesHTML}</div>
                  </div>

                  <!-- Colores -->
                  <div class="colores-section">
                    <p class="colores-title">Colores disponibles</p>
                    <div class="color-tags">${coloresHTML}</div>
                  </div>

                  <!-- Agregar al carrito -->
                  <button class="btn-gold btn-block" style="margin-bottom:.75rem" onclick="addToCart()">
                    Agregar al carrito
                  </button>

                  <!-- WhatsApp -->
                  <a href="https://wa.me/5491100000000?text=${encodeURIComponent("Hola! Quiero consultar por: " + p.nombre)}"
                     target="_blank" class="detail-btn-wa">
                    <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                    Consultar por WhatsApp
                  </a>

                  <hr class="detail-divider" />

                  <!-- Descripción -->
                  <p class="detail-section-title">Descripción</p>
                  <p class="detail-desc">${p.descripcion}</p>

                  <hr class="detail-divider" />

                  <!-- Política -->
                  <p class="detail-section-title">Política de cambios</p>
                  <div class="policy-list">
                    <div class="policy-item ok">
                      <svg class="policy-icon" width="16" height="16" fill="none" stroke="var(--gold)" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                      Cambios dentro de los 30 días con etiqueta
                    </div>
                    <div class="policy-item ok">
                      <svg class="policy-icon" width="16" height="16" fill="none" stroke="var(--gold)" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                      La prenda debe estar sin uso y sin lavar
                    </div>
                    <div class="policy-item no">
                      <svg class="policy-icon" width="16" height="16" fill="none" stroke="var(--muted)" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                      No se aceptan devoluciones de dinero
                    </div>
                  </div>
                </div>

              </div>

              ${relatedHTML}
            </div>
          </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
          <div class="container">
            <div class="footer-grid">
              <div>
                <a href="index.html" class="footer-logo">GRAN PRIX</a>
                <p class="footer-desc">Ropa masculina premium en Liniers, CABA.</p>
              </div>
              <div>
                <h3 class="footer-heading">Navegación</h3>
                <ul class="footer-links">
                  <li><a href="index.html">Inicio</a></li>
                  <li><a href="productos.html">Productos</a></li>
                  <li><a href="novedades.html">Novedades</a></li>
                  <li><a href="contacto.html">Contacto</a></li>
                </ul>
              </div>
              <div>
                <h3 class="footer-heading">Información</h3>
                <ul class="footer-links">
                  <li><a href="contacto.html">Política de cambios</a></li>
                  <li><a href="contacto.html">Pickup en local</a></li>
                </ul>
              </div>
              <div>
                <h3 class="footer-heading">Contacto</h3>
                <p class="footer-contact-text">Rivadavia 11450, Local 4<br>Liniers, CABA</p>
              </div>
            </div>
            <div class="footer-bottom">
              <p class="footer-copy">© ${new Date().getFullYear()} Gran Prix. Todos los derechos reservados.</p>
            </div>
          </div>
        </footer>`;

      // Funciones interactivas
      window.switchGalleryImg = function(src, thumb) {
        const mainImg = document.getElementById("gallery-main-img");
        if (mainImg) mainImg.src = src;
        document.querySelectorAll(".gallery-thumb").forEach(t => {
          t.classList.remove("active-thumb");
          t.style.borderColor = "";
        });
        thumb.classList.add("active-thumb");
        thumb.style.borderColor = "var(--gold)";
      };

      window.selectTalle = function(t) {
        selectedTalle = t;
        document.getElementById("talle-selected").textContent = "Seleccionado: " + t;
        document.querySelectorAll(".talle-btn").forEach(b => {
          b.classList.toggle("selected", b.dataset.talle === t);
        });
      };

      window.addToCart = function() {
        Cart.add(p, selectedTalle);
      };
    }

    function addRipple(e) {
      const el = e.currentTarget;
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const wave = document.createElement("span");
      wave.className = "ripple-wave";
      wave.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
      el.appendChild(wave);
      setTimeout(() => wave.remove(), 600);
    }
    document.querySelectorAll(".btn-gold,.btn-outline,.talle-btn,.cart-btn").forEach(el => el.addEventListener("click", addRipple));
    document.querySelectorAll(".add-btn").forEach(el => el.addEventListener("click", addRipple));
    injectCartDrawer();
  </script>
</body>
</html>
